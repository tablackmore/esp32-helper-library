<!DOCTYPE html>
<html>

<head>
  <title>ESP32 Wi-Fi Manager</title>
  <link rel="stylesheet" href="/shared/variables.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/ap/main.css">
  <link rel="icon" href="/favicon.ico" />
</head>

<body>
  <div class="container">
    <h1>ESP32 Wi-Fi Manager</h1>
    <div class="wifi-section">
      <div class="wifi-row">
        <label>Bluetooth MIDI</label>
        <button id="bluetoothToggle" class="square-btn">
          <span class="status">OFF</span>
        </button>
      </div>
      <div class="wifi-row">
        <label>Current Network</label>
        <span id="current-ssid">ESP32_Network</span>
      </div>
      <div class="wifi-row">
        <button id="scanBtn" class="square-btn">Scan Networks</button>
      </div>
      <div id="spinner" class="spinner"></div>
      <div id="available-networks"></div>
      <div id="status" class="status-message"></div>
    </div>
    <div class="wifi-section">
      <h2>Quick Links</h2>
      <div class="wifi-row">
        <a href="/shared/keyboard.html" class="square-btn">Web Keyboard</a>
      </div>
    </div>
  </div>
  <script src="/ap/main.js"></script>
</body>

</html>
