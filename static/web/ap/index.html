<!DOCTYPE html>
<html>

<head>
  <title>ESP32 Wi-Fi Manager</title>
  <link rel="stylesheet" href="/shared/variables.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/ap/main.css">
  <link rel="icon" href="/favicon.ico" />
</head>

<body>
  <div class="container">
    <h1>ESP32 Wi-Fi Manager</h1>
    <div class="card wifi-section">
      <h2>Keyboard</h2>
      <div>
        <a href="/shared/keyboard.html">Webkeyboard</a>
      </div>
      <h2>Wi-Fi Settings</h2>
      <div class="wifi-row">
        <label for="current-ssid">SSID:</label>
        <span id="current-ssid">ESP32_Network</span>
      </div>
      <div class="wifi-row">
        <button id="scanBtn">Scan Networks</button>
      </div>
      <div id="spinner" class="spinner"></div>
      <div id="available-networks"></div>
      <div id="status" style="margin-top: 20px; color: var(--secondary-color);"></div>
    </div>
  </div>
  <script src="/ap/main.js"></script>
</body>

</html>
